services:
  lanproxy-gateway:
    container_name: lanproxy-gateway
    image: iflyelf/lanproxy-gateway:latest
    restart: always

    # 透明网关必须使用宿主机网络,才能接管 LAN 转发流量
    network_mode: host

    # TPROXY + 策略路由 + nftables 需要网络管理能力。
    # 如需最小权限可去掉 privileged,仅保留 cap_add。
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_BIND_SERVICE

    volumes:
      # 配置文件(首次运行前先在宿主机准备好 gateway.yaml)
      - ./gateway.yaml:/etc/lanproxy-gateway/gateway.yaml:rw
      # DHCP 租约文件(可选,用于解析设备主机名)
      - /var/lib/misc:/var/lib/misc:ro
      # 同步时区
      - /etc/localtime:/etc/localtime:ro

    # 开启 IP 转发(容器内写 /proc 需要)
    sysctls:
      - net.ipv4.ip_forward=1
